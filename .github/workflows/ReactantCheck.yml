name: Reactant check

# The Reactant extension (`ext/BayesBaseReactantExt.jl`, `make test-reactant`), on every commit of a
# pull request and on pushes to main. It is kept apart from the test suite in `CI.yml` so that
# `Pkg.test()` does not download Reactant's binaries for people testing BayesBase locally.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reactant:
    name: Reactant check (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - run: make test-reactant
