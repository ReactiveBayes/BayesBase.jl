name: Doc Preview Cleanup

# Documenter deploys a pull request's documentation to `previews/PR<n>` on gh-pages and never
# removes it; this deletes it when the pull request is closed or merged.
on:
  pull_request:
    types: [closed]

concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete the preview
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "${preview_dir}" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf --quiet "${preview_dir}"
            git commit -m "Delete the preview of PR ${{ github.event.number }}"
            for attempt in 1 2 3; do
              git push origin HEAD:gh-pages && exit 0
              git pull --rebase origin gh-pages
            done
            exit 1
          fi
